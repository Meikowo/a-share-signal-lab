[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "a-share-signal-lab"
version = "0.1.0"
description = "Private A-share signal screening and public research snapshots."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
assl = "assl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

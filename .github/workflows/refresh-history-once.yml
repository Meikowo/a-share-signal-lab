name: Refresh historical outcomes once

on:
  push:
    paths:
      - ".github/workflows/refresh-history-once.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: assl-history-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASSL_DATABASE_URL: ${{ secrets.ASSL_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Recalculate matured historical outcomes
        run: assl run-daily --as-of 2026-08-14 --offline
      - name: Export privacy-checked public data
        run: python scripts/export_public.py public-data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build privacy-safe site
        shell: bash
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run test:run
          cd ..
          rm -rf web/public/data/fixture
          mkdir -p web/public/data
          cp -R public-data/. web/public/data/
          cd web
          npm run build
      - run: python -m assl.publish.privacy web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}

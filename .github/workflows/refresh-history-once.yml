name: ASSL Refresh History Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-history-once.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: assl-daily
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASSL_DATABASE_URL: ${{ secrets.ASSL_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Export history with matured outcomes
        run: python scripts/export_public.py public-data
      - uses: actions/upload-artifact@v4
        with:
          name: assl-public-data-refresh
          path: public-data/
          if-no-files-found: error
          retention-days: 1

  build-pages:
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: assl-public-data-refresh
          path: public-data
      - name: Test and build privacy-safe site
        shell: bash
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run test:run
          cd ..
          rm -rf web/public/data/fixture
          mkdir -p web/public/data
          cp -R public-data/. web/public/data/
          cd web
          npm run build
      - run: python -m assl.publish.privacy web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
